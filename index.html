<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MANASSE NTAMBWA - PROTOCOLE DE BLOCAGE</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100vw;
    height: 100vh;
    background: #000;
    color: #00ff66;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

#screen {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 5vw;
    background: radial-gradient(circle, #051c0d 0%, #000 85%);
    position: relative;
    z-index: 99999;
}

/* Textes cinématiques d'introduction */
.intro-text {
    font-size: clamp(22px, 5.5vw, 60px);
    font-weight: bold;
    line-height: 1.4;
    text-shadow: 0 0 15px #00ff66;
    max-width: 90vw;
    opacity: 0;
    transition: opacity 0.4s ease-in-out;
    position: absolute;
    padding: 20px;
}

.visible {
    opacity: 1;
}

/* Écran de verrouillage final */
#lock-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 0.8s ease-in;
}

#lock-container.active {
    opacity: 1;
}

#title {
    font-size: clamp(30px, 7vw, 75px);
    font-weight: bold;
    letter-spacing: 0.1em;
    text-shadow: 0 0 20px #00ff66;
    margin-bottom: 5px;
}

#owner {
    color: #fff;
    font-size: clamp(16px, 3.5vw, 32px);
    margin-bottom: 25px;
    letter-spacing: 0.05em;
}

#form {
    width: min(90%, 450px);
    margin-top: 15px;
}

input {
    width: 100%;
    padding: 18px;
    background: #020804;
    color: #00ff66;
    border: 3px solid #00ff66;
    font-size: 24px;
    text-align: center;
    outline: none;
    border-radius: 8px;
    box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
}

button {
    margin-top: 20px;
    width: 100%;
    padding: 16px;
    background: #00ff66;
    color: #000;
    border: none;
    font-weight: bold;
    font-size: 20px;
    cursor: pointer;
    border-radius: 8px;
    box-shadow: 0 0 15px rgba(0, 255, 102, 0.6);
}

#status {
    font-size: clamp(15px, 3vw, 22px);
    margin-top: 20px;
    min-height: 1.5em;
    letter-spacing: 0.05em;
}

.hidden {
    display: none !important;
}

/* Effets de Glitch / Hack Hardcore */
@keyframes glitch {
    0% { transform: translate(0); }
    20% { transform: translate(-4px, 4px); color: #ff3333; text-shadow: 0 0 10px #ff3333; }
    40% { transform: translate(-4px, -4px); color: #00ff66; }
    60% { transform: translate(4px, 4px); }
    80% { transform: translate(4px, -4px); color: #ff3333; text-shadow: 0 0 10px #ff3333; }
    100% { transform: translate(0); color: #00ff66; }
}

.glitch-effect {
    animation: glitch 0.15s infinite;
}

/* Console de déchiffrement post-déverrouillage */
#terminal-hack {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: #000;
    color: #00ff66;
    font-family: monospace;
    font-size: 14px;
    padding: 20px;
    text-align: left;
    overflow: hidden;
    z-index: 999999;
}
</style>
</head>

<body>

<main id="screen">
    <!-- Phrases d'avertissement plein écran -->
    <div id="cinematic-box" class="intro-text"></div>

    <!-- Interface du verrou -->
    <div id="lock-container" class="hidden">
        <div id="title">MANASSE</div>
        <div id="owner">ZONE SOUS CONTRÔLE DE MANASSE NTAMBWA Pour le déverrouiller, vous devrez payer Le montant est réglé à 10 dollars. ou sinon vous perdez le contrôle total de votre téléphone. </ div>
        
        <form id="form">
            <input
                id="password"
                type="password"
                placeholder="CODE MAÎTRE"
                autocomplete="off"
                required
            >
            <button type="submit">DÉVERROUILLER</button>
        </form>

        <div id="status">Ceci est un piratage.</div>
    </div>
</main>

<script>
const cinematicBox = document.getElementById("cinematic-box");
const lockContainer = document.getElementById("lock-container");
const form = document.getElementById("form");
const status = document.getElementById("status");
const password = document.getElementById("password");
const body = document.body;

// Étapes textuelles d'introduction en grand format
const steps = [
    "ALERTE : TÉLÉPHONE VERROUILLÉ.",
    "Ce téléphone est désormais sur la gestion de.:  : MANASSE NTAMBWA.",
    "AUCUNE SORTIE N'EST AUTORISÉE SANS LE CODE.",
    "INITIALISATION DU SYSTÈMES DE BLOCAGE..."
];

function typeMessage(text) {
    return new Promise(resolve => {
        cinematicBox.textContent = "";
        cinematicBox.classList.add("visible");
        let i = 0;
        function type() {
            if (i < text.length) {
                cinematicBox.textContent += text[i];
                i++;
                setTimeout(type, 25);
            } else {
                setTimeout(() => {
                    cinematicBox.classList.remove("visible");
                    setTimeout(resolve, 300);
                }, 1000);
            }
        }
        type();
    });
}

async function runCinematic() {
    for (let step of steps) {
        if (step.includes("ALERTE") || step.includes("INITIALISATION")) {
            cinematicBox.classList.add("glitch-effect");
        } else {
            cinematicBox.classList.remove("glitch-effect");
        }
        await typeMessage(step);
    }

    cinematicBox.remove();
    lockContainer.classList.remove("hidden");
    setTimeout(() => {
        lockContainer.classList.add("active");
        password.focus();
    }, 100);
}

// BLOCAGE TOTAL ANTI-FUITE (Bloque le retour en arrière, le rafraîchissement, etc.)
history.pushState(null, null, location.href);
window.addEventListener('popstate', function () {
    history.pushState(null, null, location.href);
});

// Forcer le plein écran en boucle s'il essaie de s'enfuir
document.addEventListener("click", () => {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.().catch(() => {});
    }
});

// Soumission et vérification du mot de passe
form.addEventListener("submit", function(event) {
    event.preventDefault();

    // METS TON CODE SECRET ICI
    const monCodeSecret = "MNL";

    if (password.value === monCodeSecret) {
        // Succès : Animation de piratage / décryptage intense avant de libérer le téléphone
        status.textContent = "ACCÈS AUTORISÉ — DÉCHIFFREMENT EN COURS...";
        status.style.color = "#00ff66";
        form.classList.add("hidden");

        setTimeout(() => {
            triggerHackAnimation();
        }, 800);

    } else {
        // Échec : Punition visuelle (Glitch rouge agressif)
        status.textContent = "ACCÈS REFUSÉ — INTRUS DÉTECTÉ";
        status.style.color = "#ff3333";
        password.value = "";
        body.classList.add("glitch-effect");
        setTimeout(() => body.classList.remove("glitch-effect"), 400);
        password.focus();
    }
});

// Animation de décryptage type "Matrix / Hacker" quand le bon mot de passe est entré
function triggerHackAnimation() {
    const term = document.createElement("div");
    term.id = "terminal-hack";
    document.body.appendChild(term);

    const logs = [
        "[+] Connexion au noyau local...",
        "[+] Validation de la signature cryptographique : MANASSE NTAMBWA",
        "[+] Désactivation des pare-feux de sécurité...",
        "[+] Restauration des privilèges root...",
        "[✓] SYSTÈMES DÉBLOQUÉS AVEC SUCCÈS.",
        "[✓] BIENVENUE MAÎTRE MANASSE."
    ];

    let index = 0;
    function printLog() {
        if (index < logs.length) {
            term.innerHTML += logs[index] + "<br>";
            index++;
            setTimeout(printLog, 250);
        } else {
            setTimeout(() => {
                // Quitte le plein écran et supprime le verrou pour redonner le contrôle normal du phone
                if (document.exitFullscreen) {
                    document.exitFullscreen().catch(() => {});
                }
                term.remove();
                document.body.innerHTML = "<h1 style='color:#00ff66; text-align:center; margin-top:40vh; font-family:monospace;'>APPAREIL DÉVERROUILLÉ</h1>";
            }, 1000);
        }
    }
    printLog();
}

// Lancement automatique dès l'ouverture du lien dans le navigateur
window.onload = () => {
    runCinematic();
    // Tente de forcer le plein écran immédiatement au chargement
    document.documentElement.requestFullscreen?.().catch(() => {});
};
</script>

</body>
</html>
